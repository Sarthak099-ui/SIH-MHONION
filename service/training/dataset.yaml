# Ultralytics YOLO Dataset Configuration for Onion Quality Assessment
path: ../data/onions  # dataset root dir
train: images/train   # train images (relative to 'path')
val: images/val       # val images (relative to 'path')
test: images/test     # test images (optional)

# Classes
names:
  0: healthy
  1: damaged
  2: rotten
  3: sprouted
  4: undersized
